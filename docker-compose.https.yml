# Optional automatic HTTPS. Caddy terminates TLS on ports 80/443 and forwards
# to the edge over the private Docker network, so the edge no longer publishes
# any host port itself.
#   DATAMOOV_SITE_ADDRESS = a domain  -> free Let's Encrypt certificate
#   DATAMOOV_SITE_ADDRESS = an IP     -> self-signed certificate (browser warning)
services:
  edge:
    ports: !reset []

  https:
    image: ${DATAMOV_HTTPS_IMAGE:-caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e}
    pull_policy: missing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATAMOOV_SITE_ADDRESS: ${DATAMOOV_SITE_ADDRESS:?Set DATAMOOV_SITE_ADDRESS to the domain or IP users will open}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # Issued certificates live here; losing this volume only forces a reissue.
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [public]
    depends_on:
      edge:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
