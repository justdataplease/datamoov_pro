server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Do not retain public-share bearer tokens in access logs.
map $uri $datamov_log_uri {
    ~^(/api/v1/public/shares/)[^/]+(.*)$ $1<redacted>$2;
    default $uri;
}

log_format timed '$remote_addr "$request_method $datamov_log_uri $server_protocol" '
                 '$status bytes=$body_bytes_sent '
                 'request_s=$request_time upstream_s=$upstream_response_time';
access_log /var/log/nginx/access.log timed;

gzip on;
gzip_min_length 1024;
gzip_types application/json application/problem+json text/plain text/css
           application/javascript;
gzip_vary on;

# HTTPS is terminated by the private ingress/tunnel in front of this listener.
# This edge replaces all client-supplied forwarding metadata.
server {
    listen 3000;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:3000;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; worker-src 'self' blob:; child-src 'self' blob:" always;

    client_max_body_size 200m;

    location = /edge_health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}

server {
    listen 8000;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 200m;

    location / {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
